<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="">
    <title></title>
    <link rel="icon" href="assets/favicon.png" type="image/png">
    <link rel="stylesheet" href="icons.css">
    <link rel="stylesheet" href="style.css">
    <script src="config.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="profile">
        <div class="cover" id="cover" aria-hidden="true"></div>
        <button class="share-button" id="share-button" type="button" hidden>
          <span class="icon icon-share" aria-hidden="true"></span>
          <span id="share-label"></span>
        </button>

        <div class="profile-details">
          <div class="avatar" aria-hidden="true">
            <span id="avatar-mark"></span>
            <img id="avatar-image" alt="" width="72" height="72" hidden>
          </div>
          <div class="identity">
            <h1 id="profile-name" dir="auto"></h1>
            <bdi id="profile-handle" class="handle" hidden></bdi>
          </div>
          <p id="profile-bio" class="bio" dir="auto" hidden></p>
        </div>
      </header>

      <section class="links" id="links-section" aria-labelledby="links-heading" hidden>
        <h2 id="links-heading"></h2>
        <ul class="link-list" id="link-list" role="list"></ul>
      </section>
    </main>

    <template id="card-template">
      <li class="card">
        <a class="card-link" target="_blank" rel="noopener noreferrer">
          <span class="card-tile" aria-hidden="true"><span class="icon"></span></span>
          <span class="card-text">
            <span class="card-title" dir="auto"></span>
            <span class="card-description" dir="auto"></span>
          </span>
          <span class="icon icon-arrow card-arrow" aria-hidden="true"></span>
        </a>
        <button class="copy-button" type="button">
          <span class="icon icon-copy" aria-hidden="true"></span>
        </button>
      </li>
    </template>

    <dialog id="share-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-hint">
      <div class="dialog-panel">
        <button class="dialog-close" id="dialog-close" type="button">
          <span class="icon icon-close" aria-hidden="true"></span>
        </button>
        <h2 id="dialog-title"></h2>
        <p id="dialog-hint" class="dialog-hint"></p>
        <input class="address" id="share-address" type="text" dir="ltr" readonly spellcheck="false">
        <div class="dialog-actions">
          <button class="dialog-copy" id="dialog-copy" type="button">
            <span class="icon icon-copy" aria-hidden="true"></span>
            <span id="dialog-copy-label"></span>
          </button>
          <button class="dialog-native" id="dialog-native" type="button" hidden>
            <span class="icon icon-share" aria-hidden="true"></span>
            <span id="dialog-native-label"></span>
          </button>
        </div>
      </div>
    </dialog>
    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true">
      <span class="icon icon-check" aria-hidden="true"></span>
      <span id="toast-text"></span>
    </div>
  </body>
</html>
